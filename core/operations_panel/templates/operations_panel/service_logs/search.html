{% extends 'base/layout.html' %}
{% load static %}

{% block content %}
<div class="pagetitle">
  <h1>Bitácora de Horas de Servicio</h1>
</div>

<section class="section">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Acceso por folio de operación</h5>

          {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
          {% endif %}

          <form method="post" action="{% url 'operations_panel:service_logs_open' %}">
            {% csrf_token %}
            <div class="mb-3">
              <label for="folio" class="form-label">Folio de operación</label>
              <input type="text" class="form-control form-control-lg" id="folio" name="folio" placeholder="Ej. G000123" required autofocus>
              <div class="form-text">Ingresa el folio exacto de la operación.</div>
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-primary btn-lg">
                Abrir bitácora
              </button>
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
