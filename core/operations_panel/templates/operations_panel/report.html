{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lletra - Carta Porte</title>

    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600,700&display=fallback">
    <link rel="stylesheet" href="{% static 'lib/adminlte/plugins/fontawesome-free/css/all.min.css' %}">
    <link rel="stylesheet" href="{% static 'lib/adminlte/dist/css/adminlte.min.css' %}">

    <style>
        body {
            font-family: 'Source Sans Pro', sans-serif;
            font-size: 13px;
            color: #222;
            background: #fff;
        }

        .wrapper {
            padding: 24px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .document-subtitle {
            font-size: 12px;
            color: #666;
            margin-bottom: 20px;
        }

        .section-card {
            border: 1px solid #cfcfcf;
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 18px;
            background: #fff;
        }

        .section-title {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            border-bottom: 1px solid #dcdcdc;
            padding-bottom: 6px;
            margin-bottom: 10px;
            color: #111;
        }

        .mini-table,
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 14px;
        }

        .mini-table td,
        .data-table td,
        .data-table th {
            border: 1px solid #d9d9d9;
            padding: 6px 8px;
            vertical-align: top;
        }

        .data-table th {
            background: #f4f4f4;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 12px;
        }

        .label {
            font-weight: 700;
            color: #333;
            width: 35%;
            white-space: nowrap;
        }

        .value {
            color: #111;
        }

        .header-box {
            border: 1px solid #bbb;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 16px;
        }

        .muted {
            color: #6b6b6b;
        }

        .text-center {
            text-align: center;
        }

        .text-right {
            text-align: right;
        }

        .logo-box img {
            max-height: 85px;
            max-width: 100%;
            object-fit: contain;
        }

        .spacer {
            height: 10px;
        }

        .compact td,
        .compact th {
            padding: 4px 6px;
            font-size: 12px;
        }

        @media print {
            body {
                margin: 0;
                padding: 0;
                font-size: 12px;
            }

            .wrapper {
                padding: 12px;
            }

            .section-card,
            .header-box {
                break-inside: avoid;
                page-break-inside: avoid;
            }

            .data-table,
            .mini-table {
                break-inside: avoid;
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body>
<div class="wrapper">
    {% block content %}{% endblock %}
</div>

{% block script %}{% endblock %}
</body>
</html>
