<script>
    {% if datatable_actions %}
        {% include 'supplier_panel/purchase_order/dropdown.js' %}
    {% endif %}
    function getData() {
        tblClient = new DataTable('#main_datatable', {
            order: [[0, "{{ ordering }}"]],
            dom: 'frtip',
            buttons: [
                'copyHtml5', 'excelHtml5', 'csvHtml5', 'pdfHtml5', 'colvis'
            ],
            lengthChange: true,
            pageLength: 50,
            responsive: true,
            autoWidth: false,
            destroy: true,
            deferRender: true,
            serverSide: true,
            processing: true,
            searching: true,
            searchDelay: 400,
            ajax: {
                url: window.location.pathname,
                type: 'POST',
                data: function (d) {
                    return {
                        action: 'searchdata',
                        draw: d.draw,
                        search: d.search.value,
                        start: d.start,
                        length: d.length,
                        order_col: d.order?.[0]?.column,
                        order_dir: d.order?.[0]?.dir,
                        csrfmiddlewaretoken: csrfToken
                    };
                },
                dataSrc: "data"
            },
            columns: [
                {% for column in datatable_keys %}
                    {"data": "{{ column }}"},
                {% endfor %}
                {% if datatable_actions %}
                    {"data": "id"},
                {% endif %}
            ],
            columnDefs: [
                {
                    targets: [-1],
                    className: 'text-center',
                    orderable: false,
                    render: function (data, type, row) {
                        {% if datatable_actions %}
                            return dropdown(data, type, row);
                        {% else %}
                            return data;
                        {% endif %}
                    }
                }
            ],
            rowCallback: function (row, data) {
                function styleCells(row) {
                    $('td', row).each(function () {
                        const value = $(this).text().trim();
                        if (value === "true" || value === "True") {
                            $(this).css('background-color', 'rgb(200, 255, 200)').text("✔");
                        } else if (value === "false" || value === "False") {
                            $(this).css('background-color', 'rgb(255, 200, 200)').text("✘");
                        }
                        if (value === "PAGADA") {
                            $(this).css('background-color', 'rgb(200, 255, 200)').text("PAGADA");
                        }
                        if (value === "ENVIADA") {
                            $(this).css('background-color', 'rgb(255, 200, 200)').text("ENVIADA");
                        }
                    });
                }

                styleCells(row);
            }
        });
    }

    $(document).ready(function () {
        getData();
        {% include 'base/elements/table/actions.js' %}
    });
</script>
