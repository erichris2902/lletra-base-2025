{% extends 'base/layout.html' %}
{% load static %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">{{ title }}</h3>
                    <div class="card-tools">
                        <a href="{% url 'admin_panel:purchase_order_create' %}" class="btn btn-primary">
                            <i class="fas fa-plus"></i> Nueva Orden
                        </a>
                    </div>
                </div>
                <div class="card-body">
                    <table id="main_datatable" class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>Folio</th>
                                <th>Proveedor</th>
                                <th>Operador</th>
                                <th>Estado</th>
                                <th>Total</th>
                                <th>Fecha</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
{% include 'admin_panel/datatable_base.html' %}
{% endblock %}
