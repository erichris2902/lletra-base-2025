<script>
document.addEventListener('DOMContentLoaded', function() {
    const table = $('#main_datatable').DataTable({
        // Configuración básica
        processing: true,
        serverSide: true,
        responsive: true,
        pageLength: 25,
        lengthMenu: [[10, 25, 50, 100, -1], [10, 25, 50, 100, "Todos"]],

        // Configuración de idioma en español
        language: {
            processing: "Procesando...",
            search: "Buscar:",
            lengthMenu: "Mostrar _MENU_ registros",
            info: "Mostrando registros del _START_ al _END_ de un total de _TOTAL_ registros",
            infoEmpty: "Mostrando registros del 0 al 0 de un total de 0 registros",
            infoFiltered: "(filtrado de un total de _MAX_ registros)",
            infoPostFix: "",
            loadingRecords: "Cargando...",
            zeroRecords: "No se encontraron registros",
            emptyTable: "No hay datos disponibles en la tabla",
            paginate: {
                first: "Primero",
                previous: "Anterior",
                next: "Siguiente",
                last: "Último"
            },
            aria: {
                sortAscending: ": Activar para ordenar la columna de manera ascendente",
                sortDescending: ": Activar para ordenar la columna de manera descendente"
            }
        },

        // Configuración AJAX
        ajax: {
            url: window.location.href,
            type: 'POST',
            data: function(d) {
                // Agregar token CSRF
                d.csrfmiddlewaretoken = $('[name=csrfmiddlewaretoken]').val();
                d.action = 'searchdata';

                // Mapear parámetros de DataTables a formato del servidor
                d.start = d.start || 0;
                d.length = d.length || 25;
                d.search = d.search.value || '';
                d.order_column = d.order && d.order.length > 0 ? d.order[0].column : 0;
                d.order_dir = d.order && d.order.length > 0 ? d.order[0].dir : 'asc';

                return d;
            },
            dataSrc: function(json) {
                // Procesar respuesta del servidor
                return json.data || [];
            },
            error: function(xhr, error, thrown) {
                console.error('Error en DataTable AJAX:', error);
                alert('Error al cargar los datos. Por favor, intenta nuevamente.');
            }
        },

        // Configuración de columnas
        columns: [
            {
                data: 'folio',
                name: 'folio',
                orderable: true,
                searchable: true
            },
            {
                data: 'service_folio',
                name: 'service_folio',
                orderable: false,
                searchable: true,
                defaultContent: 'N/A'
            },
            {
                data: 'client',
                name: 'client',
                orderable: true,
                searchable: true
            },
            {
                data: 'driver',
                name: 'driver',
                orderable: true,
                searchable: true,
                defaultContent: 'N/A'
            },
            {
                data: 'status',
                name: 'status',
                orderable: true,
                searchable: true,
                render: function(data, type, row) {
                    if (type === 'display') {
                        const statusClasses = {
                            'Borrador': 'bg-secondary',
                            'Publicada': 'bg-info',
                            'Enviada': 'bg-primary',
                            'En Espera': 'bg-warning',
                            'Aprobada': 'bg-success',
                            'Pagada': 'bg-dark'
                        };
                        const cssClass = statusClasses[data] || 'bg-secondary';
                        return `<span class="badge ${cssClass}">${data}</span>`;
                    }
                    return data;
                }
            },
            {
                data: 'total',
                name: 'total',
                orderable: true,
                searchable: false,
                className: 'text-end'
            },
            {
                data: 'created_at',
                name: 'created_at',
                orderable: true,
                searchable: false,
                className: 'text-center'
            },
            {
                data: 'id',
                name: 'actions',
                orderable: false,
                searchable: false,
                className: 'text-center',
                width: '120px',
                render: function(data, type, row) {
                    if (type === 'display') {
                        return `
                            <div class="btn-group" role="group">
                                <a href="/purchase-orders/${data}/"
                                   class="btn btn-sm btn-outline-primary"
                                   title="Ver detalles">
                                    <i class="fas fa-eye"></i>
                                </a>
                                <a href="/purchase-orders/${data}/pdf/"
                                   class="btn btn-sm btn-outline-info"
                                   title="Generar PDF"
                                   target="_blank">
                                    <i class="fas fa-file-pdf"></i>
                                </a>
                                <button type="button"
                                        class="btn btn-sm btn-outline-danger"
                                        title="Eliminar"
                                        onclick="confirmDelete(${data})">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        `;
                    }
                    return data;
                }
            }
        ],

        // Configuración de ordenamiento por defecto
        order: [[6, 'desc']], // Ordenar por fecha de creación descendente

        // Configuración de DOM
        dom: '<"row"<"col-sm-12 col-md-6"l><"col-sm-12 col-md-6"f>>' +
             '<"row"<"col-sm-12"tr>>' +
             '<"row"<"col-sm-12 col-md-5"i><"col-sm-12 col-md-7"p>>',

        // Configuraciones adicionales
        autoWidth: false,
        scrollX: true,
        stateSave: true,
        stateDuration: 60 * 60 * 24, // 24 horas

        // Callbacks
        initComplete: function() {
            console.log('DataTable de órdenes de compra inicializado correctamente');
        },

        drawCallback: function(settings) {
            // Inicializar tooltips después de cada redibujado
            $('[data-toggle="tooltip"]').tooltip();

            // Actualizar contadores o elementos personalizados
            updateTableInfo(this.api());
        }
    });

    // Agregar token CSRF a todas las peticiones AJAX
    $.ajaxSetup({
        beforeSend: function(xhr, settings) {
            if (!/^(GET|HEAD|OPTIONS|TRACE)$/i.test(settings.type) && !this.crossDomain) {
                xhr.setRequestHeader("X-CSRFToken", $('[name=csrfmiddlewaretoken]').val());
            }
        }
    });

    // Función para confirmar eliminación
    window.confirmDelete = function(id) {
        if (confirm('¿Estás seguro de que deseas eliminar esta orden de compra?')) {
            fetch(`/purchase-orders/${id}/delete/`, {
                method: 'DELETE',
                headers: {
                    'X-CSRFToken': $('[name=csrfmiddlewaretoken]').val(),
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                if (response.ok) {
                    table.ajax.reload();
                    showSuccessMessage('Orden de compra eliminada correctamente');
                } else {
                    throw new Error('Error al eliminar');
                }
            })
            .catch(error => {
                console.error(error);
                showErrorMessage('No se pudo eliminar la orden de compra.');
            });
        }
    };
});
</script>
