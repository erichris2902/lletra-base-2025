<script>
    {% if datatable_actions %}
        {% include 'base/elements/table/dropdown.js' %}
    {% endif %}
    function getData() {
        tblClient = new DataTable('#main_datatable', {
            order: [[0, "{{ ordering }}"]],
            dom: 'frtip',
            buttons: [
                'copyHtml5', 'excelHtml5', 'csvHtml5', 'pdfHtml5', 'colvis'
            ],
            lengthChange: true,
            pageLength: 50,
            responsive: true,
            autoWidth: false,
            destroy: true,
            deferRender: true,
            serverSide: true,
            processing: true,
            searching: true,     // por si acaso
            searchDelay: 400,    // para no spamear requests
            ajax: {
                url: window.location.pathname,
                type: 'POST',
                data: function (d) {
                    return {
                        action: 'searchdata',
                        draw: d.draw,                 // ✅ FALTABA
                        search: d.search.value,     // ✅ lo que escribe el usuario
                        start: d.start,             // ✅ offset
                        length: d.length,           // ✅ page size
                        order_col: d.order?.[0]?.column,
                        order_dir: d.order?.[0]?.dir,
                        csrfmiddlewaretoken: csrfToken
                    };

                },
                dataSrc: "data"
            },
            columns: [
                {% for column in datatable_keys %}
                    {"data": "{{ column }}"},
                {% endfor %}
                {% if datatable_actions %}
                    {"data": "id"},
                {% endif %}
            ],
            columnDefs: [
                {
                    targets: [-1],
                    className: 'text-center',
                    orderable: false,
                    render: function (data, type, row) {
                        {% if datatable_actions %}
                            return dropdown(data, type, row);
                        {% else %}
                            return data;
                        {% endif %}
                    }
                }
            ],
            rowCallback: function (row, data) {
                {% if callback_js %}
                    {{ callback_js }}
                {% else %}
                    {% include 'base/elements/table/row_callback.js' %}
                {% endif %}
            }
        });
    }

    $(document).ready(function () {
        getData();
        {% if datatable_actions %}
            {% include 'base/elements/table/actions.js' %}
        {% endif %}
    });
</script>
